format:
  html:
    theme: 
        light: [cosmo, theme.scss]
        dark: darkly
    code-copy: true
    code-overflow: wrap
    # link-external-icon: true
    link-external-newwindow: false
    link-external-filter: '^(?:http:|https:)\/\/www\.quarto\.org\/custom'
    # css: styles.css
    fontsize: 22px
    toc: true
    toc-location: left
    toc-expand: true	
    number-sections: false
    number-depth: 2
    smooth-scroll: true
    fig-cap-location: top
    scrollable: true
    grid:
      sidebar-width: 350px


filters:
  # - include-files.lua
  - lightbox
  - quarto
lightbox: 
  match: auto
  effect: zoom
  desc-position: top

